plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    id 'kotlinx-serialization'
}
static def versionNameDate() {
    return new Date().format("yyyyMMdd.HH", TimeZone.getTimeZone("GMT+8"))
}

static def getAppGitHead() {
    return "git rev-parse HEAD".execute().text.trim()
}

static def getAppBuildTime() {
    return "git log -1 --pretty=%ai".execute().text.trim()
}


android {
    compileSdk 36
    namespace 'com.yuyan.imemodule'
    defaultConfig {
        minSdk 23
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', "x86", "x86_64"
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: project.getName()]
            }
        }
        lintOptions {
            abortOnError false
        }

        buildConfigField "String", "versionName", "\"${versionNameDate()}\""
        buildConfigField "String", "AppCommitHead", "\"${getAppGitHead()}\""
        buildConfigField "String", "AppBuildTime", "\"${getAppBuildTime()}\""
    }

    //多渠道打包: app中多渠道配置要一致
    flavorDimensions = ["default"]
    productFlavors {
        offline {
            dimension "default"
            buildConfigField "Boolean", "offline", "true"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            resValue("string", "app_name", "@string/ime_yuyan_name")
            resValue("drawable", "app_icon", "@drawable/huahua_app_icon")
        }
        debug {
            resValue("string", "app_name", "@string/ime_yuyan_name_debug")
            resValue("drawable", "app_icon", "@drawable/huahua_app_icon")
        }
    }
    sourceSets {
        offline {
            // 花花：libonnxruntime.so（离线语音用，28MB，超过 GitHub 网页上传 25MB 限制）不进仓库，
            // 构建时由 fetchOnnxRuntime 从 Maven Central 下载官方 AAR 解出；
            // 如果手动把它放进了 libs/arm64-v8a/，就直接用那份。
            jniLibs.srcDirs = file('libs/arm64-v8a/libonnxruntime.so').exists() ? ['libs'] : ['libs', "$buildDir/huahua-ort/jniLibs"]
        }
    }

    //第三方库使用java1.8
    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.emoji2:emoji2:1.5.0'
    implementation 'androidx.emoji2:emoji2-views:1.5.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'
    implementation 'com.louiscad.splitties:splitties-resources:3.0.0'
    implementation 'com.louiscad.splitties:splitties-views-dsl-recyclerview:3.0.0'
    implementation 'com.louiscad.splitties:splitties-views-dsl-constraintlayout:3.0.0'
    implementation 'com.louiscad.splitties:splitties-views-dsl-appcompat:3.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation "androidx.room:room-runtime:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
}

// 花花：下载 onnxruntime-android（与 Xime 同版本），只取 arm64-v8a 的 libonnxruntime.so，校验 SHA-256
def huahuaOrtVersion = '1.28.0'
def huahuaOrtSha256 = 'f351a0638696f54b35184290dbc001d66daae17281ad0b548d2c70347d53b8a9'
tasks.register('fetchOnnxRuntime') {
    def outSo = file("$buildDir/huahua-ort/jniLibs/arm64-v8a/libonnxruntime.so")
    def manual = file('libs/arm64-v8a/libonnxruntime.so')
    outputs.file(outSo)
    onlyIf { !manual.exists() }
    doLast {
        if (outSo.exists() && outSo.length() > 1000000) return
        def aar = file("$buildDir/huahua-ort/onnxruntime-android-${huahuaOrtVersion}.aar")
        aar.parentFile.mkdirs()
        def sha = { File f ->
            def md = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { is -> byte[] b = new byte[65536]; int n; while ((n = is.read(b)) > 0) md.update(b, 0, n) }
            md.digest().collect { String.format('%02x', it) }.join()
        }
        def path = "com/microsoft/onnxruntime/onnxruntime-android/${huahuaOrtVersion}/onnxruntime-android-${huahuaOrtVersion}.aar"
        def urls = ["https://repo1.maven.org/maven2/$path", "https://maven.aliyun.com/repository/central/$path"]
        boolean ok = aar.exists() && sha(aar) == huahuaOrtSha256
        for (int attempt = 0; attempt < 3 && !ok; attempt++) {
            for (u in urls) {
                try {
                    println "下载 onnxruntime: $u"
                    def conn = new URL(u).openConnection()
                    conn.connectTimeout = 30000
                    conn.readTimeout = 120000
                    conn.inputStream.withStream { is -> aar.withOutputStream { os -> os << is } }
                    if (sha(aar) == huahuaOrtSha256) { ok = true; break }
                    println "SHA-256 不匹配，重试"
                } catch (Exception e) {
                    println "下载失败：${e.message}"
                }
            }
        }
        if (!ok) throw new GradleException("onnxruntime-android ${huahuaOrtVersion} 下载失败")
        copy {
            from(zipTree(aar)) { include 'jni/arm64-v8a/libonnxruntime.so' }
            into("$buildDir/huahua-ort/tmp")
        }
        outSo.parentFile.mkdirs()
        file("$buildDir/huahua-ort/tmp/jni/arm64-v8a/libonnxruntime.so").renameTo(outSo)
        if (!outSo.exists()) throw new GradleException('AAR 里没有 jni/arm64-v8a/libonnxruntime.so')
    }
}
preBuild.dependsOn fetchOnnxRuntime

tasks.register('makeaar', Copy) {
    from('build/outputs/aar/')
    into('build/outputs/aar/')
    include('imeModule-dev-debug.aar')
    rename('imeModule-dev-debug.aar', 'imesdk_' + versionNameDate() + '.aar')
}

makeaar.dependsOn(build)
